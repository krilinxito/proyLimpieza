# ============================================================
#  SYNC RULES — qué datos baja cada dispositivo
#
#  Esto no es una capa de comodidad: es control de acceso real.
#  Lo que no aparece acá no llega nunca al dispositivo.
#
#  Tres reglas que NO se tocan sin discutirlo:
#
#   1. `password_hash` no se sincroniza jamás. Por eso `usuarios`
#      se replica con lista explícita de columnas, nunca SELECT *.
#   2. `auditoria` no se sincroniza a ningún dispositivo. Se
#      consulta por API y solo el rol ADMIN puede verla.
#   3. El ADMIN no descarga el histórico. Su dashboard es online y
#      agrega en Postgres; bajarle años de órdenes al navegador
#      sería trabajo puro sin beneficio. La única excepción es
#      cuando atiende el mostrador: entonces baja la ropa de esa
#      sucursal, igual que un empleado (`atencion_admin`).
#
#  Limitación a tener presente: las consultas de `data` no admiten
#  JOINs ni subconsultas. Por eso `entregas` y `pagos` cargan su
#  propio `sucursal_id` duplicado — ver el comentario en el schema.
# ============================================================

bucket_definitions:

  # ----------------------------------------------------------
  #  El trabajo de mi sucursal.
  #  El parámetro sale del usuario dueño del token: un empleado
  #  solo puede recibir las órdenes de la sucursal que tiene
  #  asignada en la base. Un ADMIN tiene sucursal_id NULL, así que
  #  este bucket le queda vacío — es lo que queremos.
  # ----------------------------------------------------------
  sucursal:
    # `activo = true` es lo que hace efectiva la baja lógica: sin esta línea, un empleado
    # dado de baja seguiría recibiendo las órdenes de su sucursal mientras su token viva.
    parameters: |
      SELECT sucursal_id FROM usuarios
      WHERE id = request.user_id()
        AND sucursal_id IS NOT NULL
        AND activo = true
    data:
      - SELECT * FROM ordenes  WHERE sucursal_id = bucket.sucursal_id
      - SELECT * FROM entregas WHERE sucursal_id = bucket.sucursal_id
      - SELECT * FROM pagos    WHERE sucursal_id = bucket.sucursal_id

  # ----------------------------------------------------------
  #  El ADMIN que atiende el mostrador — SPEC-KRILINXI-028.
  #  A veces el dueño atiende. Elige en la tablet en qué sucursal,
  #  y la tablet lo manda como parámetro al conectarse
  #  (`connect({ params: { sucursal_id } })`). Este bucket le baja
  #  la ropa de esa sucursal, lo mismo que `sucursal` a un empleado.
  #
  #  El parámetro lo controla la tablet: puede mandar cualquier
  #  cosa. Por eso NO autoriza nada. Lo que autoriza es la fila del
  #  que pide: `id = request.user_id()` (la cuenta del token), y que
  #  esa cuenta sea ADMIN y esté activa. Un empleado que mande el
  #  parámetro no tiene fila que cumpla `rol = 'ADMIN'`: este bucket
  #  no existe para él. Un ADMIN que no está atendiendo no manda
  #  el parámetro, y la última condición hace que el bucket no
  #  exista: no baja nada, como siempre (regla 3).
  #
  #  Que el ADMIN elija cualquier sucursal es correcto: ya las ve
  #  todas por la API y el panel. El parámetro solo dice cuál baja.
  #
  #  Sin `accept_potentially_dangerous_queries`, a propósito.
  #  PowerSync no marca esta consulta porque está atada a
  #  `request.user_id()` (comprobado con su validador: sin esa
  #  condición avisa "Potentially dangerous query"). El flag no
  #  autoriza nada: solo callaría ese aviso si alguien la borrara.
  # ----------------------------------------------------------
  atencion_admin:
    parameters: |
      SELECT request.parameters() ->> 'sucursal_id' AS sucursal_id
      FROM usuarios
      WHERE id = request.user_id()
        AND rol = 'ADMIN'
        AND activo = true
        AND request.parameters() ->> 'sucursal_id' IS NOT NULL
    data:
      - SELECT * FROM ordenes  WHERE sucursal_id = bucket.sucursal_id
      - SELECT * FROM entregas WHERE sucursal_id = bucket.sucursal_id
      - SELECT * FROM pagos    WHERE sucursal_id = bucket.sucursal_id

  # ----------------------------------------------------------
  #  Catálogos que todo dispositivo necesita.
  #
  #  Los clientes son globales a propósito: el mismo cliente puede
  #  dejar ropa en sucursales distintas en visitas distintas, y el
  #  alta por teléfono tiene que encontrarlo desde cualquiera. La
  #  ropa de cada orden, eso sí, se retira donde se dejó.
  #
  #  Solo para cuentas activas (SPEC-ALE186-024). Antes no tenía
  #  `parameters` y se entregaba a cualquier token válido: una
  #  cuenta dada de baja seguía bajando todos los clientes hasta
  #  que su token vencía.
  #
  #  La consulta no devuelve columnas A PROPÓSITO. Cada columna que
  #  devuelve `parameters` es un parámetro del bucket, y PowerSync
  #  exige que todas las consultas `data` lo usen ("Query must cover
  #  all bucket parameters"); estos catálogos no dependen de quién
  #  los pide. Sin columnas, la consulta solo decide SI el bucket
  #  existe para ese usuario: si encuentra su fila activa, sí.
  #  Comprobado con el validador de PowerSync 1.25.
  # ----------------------------------------------------------
  global:
    parameters: |
      SELECT FROM usuarios
      WHERE id = request.user_id()
        AND activo = true
    data:
      - SELECT * FROM clientes
      - SELECT id, nombre, direccion, telefono, activa FROM sucursales
      # Sin password_hash. Sirve para mostrar "recibido por María"
      # sin tener que pedirlo a la API.
      - SELECT id, nombre_completo, username, rol, sucursal_id, activo FROM usuarios
